<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ManimCat Web</title>
    
    <!-- KaTeX CSS for math formulas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.css" />
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {}
        }
      }
    </script>
    
    <!-- Studio Color Palette & Theme Styles -->
    <style>
      :root {
        --studio-bg: #f6f4ec;
        --studio-surface: #ffffff;
        --studio-surface-2: #efece1;
        --studio-border: #dcd6c4;
        --studio-ink: #1e293b;
        --studio-muted: #5b6673;
        --studio-accent: #455a64;
        --studio-accent-2: #2f7d6e;
      }
      .dark {
        --studio-bg: #0b1017;
        --studio-surface: #121924;
        --studio-surface-2: #182232;
        --studio-border: #243247;
        --studio-ink: #eef2f7;
        --studio-muted: #93a3b8;
        --studio-accent: #6aa9be;
        --studio-accent-2: #4fd1b5;
      }
      body {
        background-color: var(--studio-bg);
        color: var(--studio-ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
      .katex-display {
        margin: 0.35em 0 !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
